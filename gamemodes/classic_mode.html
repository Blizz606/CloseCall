<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloseCall | Classic Mode</title>
  <link rel="icon" type="image/png" href="../images/logo.png" />


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --blue: #2f73f6;
      --blue-dark: #1f62e6;
      --text: #08090b;
      --muted: #8490a7;
      --line: #dfe3ea;
      --surface: rgba(255, 255, 255, 0.94);
      --radius-card: 56px;
      --shadow-card: 0 24px 54px rgba(51, 64, 94, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 96px 0 32px;
      font-family: Inter, system-ui, sans-serif;
      background:
        linear-gradient(rgba(245, 249, 255, 0.18), rgba(245, 249, 255, 0.18)),
        url("../images/Background.png") center / cover fixed no-repeat;
    }

    .game {
      position: relative;
      width: min(1495px, calc(100% - 48px));
      display: grid;
      grid-template-columns: 1.28fr 0.82fr;
      gap: 120px;
      padding: 38px 0;
      transition:
        grid-template-columns 760ms cubic-bezier(0.22, 1, 0.36, 1),
        gap 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .topbar {
      position: absolute;
      top: -74px;
      left: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 72px;
      padding: 0 30px;
      box-sizing: border-box;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 28px rgba(51, 64, 94, 0.1);
      backdrop-filter: blur(14px);
    }

    .topbar-stats {
      display: flex;
      align-items: center;
      gap: 46px;
      min-width: 0;
    }

    .stat {
      min-width: 0;
      padding: 0;
      color: #8490a7;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }

    .stat strong {
      margin-left: 5px;
      color: #08090b;
      font-size: 18px;
    }

    .stat i {
      margin-right: 6px;
      font-size: 15px;
    }

    .stat--streak i {
      color: #ff7075;
    }

    .stat--score i {
      color: #e3a933;
    }

    .stat--time i {
      color: var(--blue);
    }

    .account-summary {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      color: #38455b;
      font-size: 14px;
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 24px;
      min-width: 0;
    }

    .topbar-home {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border-radius: 50%;
      color: #657087;
      background: rgba(101, 112, 135, 0.08);
      font-size: 14px;
      text-decoration: none;
      transition: color 200ms ease, background 200ms ease, transform 200ms ease;
    }

    .topbar-home:hover {
      color: var(--blue);
      background: rgba(47, 115, 246, 0.12);
      transform: translateY(-1px);
    }

    .account-summary i {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      background: rgba(47, 115, 246, 0.1);
      font-size: 17px;
    }

    .account-summary span {
      overflow: hidden;
      max-width: 160px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .next-progress {
      position: absolute;
      top: 0;
      left: -8px;
      z-index: 4;
      width: calc(100% + 16px);
      height: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: #f0f1f3;
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease;
    }

    .next-progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #d5d6d8;
      transition: none;
    }

    .game.is-advancing .next-progress-fill {
      width: 100%;
      transition: width 5000ms linear 760ms;
    }

    .game.is-advancing .next-progress {
      opacity: 1;
      visibility: visible;
      transition-delay: 760ms;
    }

    .card {
      min-height: 725px;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
    }

    .question-card {
      position: relative;
      z-index: 2;
      overflow: hidden;
      padding: 62px 76px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .question-card > * {
      transition:
        opacity 260ms ease,
        transform 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .loading-bars {
      position: absolute;
      inset: auto auto 0 50%;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      gap: 72px;
      width: 392px;
      height: 430px;
      opacity: 0;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .result-summary {
      position: absolute;
      top: 58px;
      left: 0;
      z-index: 3;
      width: 100%;
      margin: 0;
      color: #111217;
      text-align: center;
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 400;
      letter-spacing: -2.2px;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition:
        opacity 240ms ease,
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .result-summary span {
      color: #ff7075;
      font-weight: 600;
    }

    .off-by {
      position: absolute;
      top: 154px;
      left: 0;
      z-index: 3;
      width: 100%;
      margin: 0;
      color: #8490a7;
      text-align: center;
      font-size: 32px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition:
        opacity 240ms ease,
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .loading-bar {
      display: block;
      width: 160px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 24px;
      box-sizing: border-box;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.25;
      text-align: center;
      border-radius: 28px 28px 0 0;
      transform: scaleY(0);
      transform-origin: bottom;
    }

    .loading-bar.is-compact {
      padding-bottom: 0;
      font-size: 0;
    }

    .loading-bar--blue {
      height: var(--real-height, 57%);
      background: #4e7df7;
    }

    .loading-bar--red {
      height: var(--your-height, 80%);
      background: #ff7075;
    }

    .game.is-advancing .question-card > *:not(.loading-bars):not(.result-summary):not(.off-by):not(.next-progress) {
      opacity: 0;
      transform: translateX(-18px);
      transition-delay: 760ms;
      transition-duration: 140ms, 260ms;
    }

    .game.is-advancing .loading-bars {
      opacity: 1;
      transition: opacity 220ms ease 760ms;
    }

    .game.is-advancing .result-summary {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 760ms;
    }

    .game.is-advancing .off-by {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 760ms;
    }

    .game.is-advancing .loading-bar {
      animation: bar-rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 760ms both;
    }

    .game.is-advancing .loading-bar--red {
      animation-delay: 860ms;
    }

    .game.is-finishing .next-progress {
      opacity: 0;
      visibility: hidden;
      transition-delay: 0ms;
    }

    @keyframes bar-rise {
      from {
        transform: scaleY(0);
      }
      to {
        transform: scaleY(1);
      }
    }

    .image-card {
      z-index: 1;
      transition:
        opacity 560ms ease,
        transform 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .game.is-advancing .question-card {
      border-radius: var(--radius-card);
    }

    .game.is-advancing .image-card {
      opacity: 0;
      transform: translateX(12px) scale(1.02);
      transition-delay: 480ms;
    }

    .game.is-advancing {
      grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
      gap: 0;
    }

    .end-screen {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 76px;
      color: var(--text);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(18px);
      pointer-events: none;
      transition:
        opacity 420ms ease,
        transform 760ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0ms linear 760ms;
    }

    .end-kicker {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .end-score-label {
      margin: 0 0 12px;
      color: #5f6878;
      font-size: clamp(29px, 4vw, 48px);
      font-weight: 400;
      letter-spacing: -0.055em;
    }

    .end-score {
      margin: 0;
      color: var(--blue);
      font-size: clamp(96px, 14vw, 190px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.09em;
    }

    .play-again-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 164px;
      height: 50px;
      margin: 0;
      border: 0;
      border-radius: 18px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: none;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      transition: transform 240ms ease, background 240ms ease;
    }

    .play-again-button:hover {
      background: var(--blue-dark);
      box-shadow: none;
      transform: translateY(-2px);
    }

    .play-again-button:active {
      box-shadow: none;
    }

    .end-actions {
      display: grid;
      gap: 10px;
      margin-top: 42px;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      color: #667188;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: color 220ms ease, transform 220ms ease;
    }

    .home-button:hover {
      color: var(--blue);
      transform: translateY(-1px);
    }

    .game.is-complete {
      grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
      gap: 0;
    }

    .game.is-complete .image-card,
    .game.is-complete .question-card > *:not(.end-screen) {
      opacity: 0;
      transform: translateX(-18px);
      pointer-events: none;
    }

    .game.is-complete .end-screen {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 180ms, 180ms, 0ms;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
    }

    .category {
      color: var(--blue);
      background: #edf4ff;
    }

    .category-icon {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      font-size: 18px;
    }

    .progress {
      color: #111217;
      background: #f1f1f3;
    }

    h1 {
      max-width: 670px;
      margin: 86px 0 28px;
      color: var(--text);
      font-size: clamp(48px, 4.6vw, 72px);
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -3.8px;
    }

    h1 span {
      color: var(--blue);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.45;
      letter-spacing: -0.5px;
    }

    form {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 48px;
    }

    .input-wrap {
      position: relative;
      width: min(100%, 548px);
    }

    input {
      width: 100%;
      height: 96px;
      padding: 0 76px 0 78px;
      border: 2px solid var(--line);
      border-radius: 26px;
      outline: 0;
      color: var(--text);
      font: inherit;
      font-size: 25px;
      transition: border-color 220ms ease, box-shadow 220ms ease;
    }

    input::placeholder {
      color: #c8cbd1;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 5px #eaf1ff;
    }

    .ruler {
      position: absolute;
      top: 33px;
      left: 28px;
      color: #8b96aa;
      font-size: 28px;
      pointer-events: none;
    }

    .unit {
      position: absolute;
      top: 30px;
      right: 28px;
      color: #909bae;
      font-size: 28px;
      pointer-events: none;
    }

    button {
      width: 96px;
      height: 96px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 26px;
      cursor: pointer;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 13px 25px rgba(47, 115, 246, 0.25);
      font-size: 42px;
      transition:
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        background-color 500ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    button i {
      display: inline-block;
      transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    button:hover {
      background: #397bf3;
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 18px 32px rgba(47, 115, 246, 0.28);
    }

    button:hover i {
      transform: translateX(4px);
    }

    button:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 8px 16px rgba(47, 115, 246, 0.22);
    }

    button:focus-visible {
      outline: 4px solid rgba(47, 115, 246, 0.22);
      outline-offset: 5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .game,
      .next-progress,
      .next-progress-fill,
      button,
      button i,
      .question-card > *,
      .image-card,
      .loading-bars,
      .loading-bar,
      .result-summary,
      .off-by {
        transition: none;
        animation: none;
      }
    }

    .feedback {
      display: none;
      min-height: 31px;
      margin: 27px 0 0;
      color: var(--blue);
      font-size: 20px;
      font-weight: 650;
    }

    .image-card {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(81, 189, 226, 0.16), rgba(18, 33, 42, 0.12)),
        url("https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1100&q=90")
        center / cover;
    }

    .image-card::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(to bottom, transparent 55%, rgba(5, 20, 16, 0.15));
      pointer-events: none;
    }

    @media (max-width: 980px) {
      .game {
        width: min(650px, calc(100% - 28px));
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 26px 0;
      }

      .topbar {
        top: -56px;
        height: 60px;
        padding: 0 20px;
      }

      .topbar-stats {
        gap: 30px;
      }

      .account-summary {
        gap: 6px;
        font-size: 13px;
      }

      .topbar-actions {
        gap: 8px;
        margin-left: 14px;
      }

      .topbar-home {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
        font-size: 13px;
      }

      .account-summary i {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
        font-size: 15px;
      }

      .account-summary span {
        max-width: 92px;
      }

      .stat {
        font-size: 13px;
      }

      .stat strong {
        font-size: 15px;
      }

      .stat i {
        margin-right: 3px;
        font-size: 12px;
      }

      .next-progress {
        left: -6px;
        width: calc(100% + 12px);
        height: 11px;
      }

      .game.is-advancing .question-card {
        transform: none;
      }

      .game.is-advancing {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .game.is-advancing .image-card {
        transform: translateY(16px);
      }

      .card {
        min-height: auto;
        border-radius: 45px;
      }

      .question-card {
        min-height: 565px;
        padding: 42px 34px;
      }

      .end-screen {
        padding: 42px 28px;
      }

      .loading-bars {
        gap: 24px;
        width: 216px;
        height: 270px;
      }

      .loading-bar {
        width: 96px;
        border-radius: 18px 18px 0 0;
      }

      .result-summary {
        top: 40px;
        font-size: clamp(29px, 7.5vw, 44px);
        letter-spacing: -1.4px;
      }

      .off-by {
        top: 122px;
        font-size: 23px;
      }

      .image-card {
        min-height: 460px;
      }

      h1 {
        margin: 65px 0 23px;
        font-size: clamp(48px, 12vw, 68px);
        letter-spacing: -3.3px;
      }

      .subtitle {
        font-size: 20px;
      }

      form {
        gap: 16px;
        margin-top: 40px;
      }

      input,
      button {
        height: 82px;
        border-radius: 23px;
      }

      input {
        padding-left: 67px;
        font-size: 22px;
      }

      button {
        width: 82px;
        font-size: 39px;
      }

      .ruler {
        top: 25px;
        left: 23px;
        font-size: 22px;
      }

      .unit {
        top: 23px;
        font-size: 22px;
      }

      .pill {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <div class="topbar" aria-label="Game stats">
      <div class="topbar-stats">
        <div class="stat stat--streak"><i class="fa-solid fa-fire" aria-hidden="true"></i>Streak <strong id="streak">0</strong></div>
        <div class="stat stat--score"><i class="fa-solid fa-trophy" aria-hidden="true"></i>Score <strong id="score">0</strong></div>
        <div class="stat stat--time"><i class="fa-solid fa-clock" aria-hidden="true"></i>Avg. time <strong id="averageTime">0.0s</strong></div>
      </div>
      <div class="topbar-actions">
        <a class="topbar-home" href="../index.html" aria-label="Back to home">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
        <div class="account-summary" aria-label="Signed-in account">
          <i class="fa-regular fa-circle-user" aria-hidden="true"></i>
          <span id="accountName">Player</span>
        </div>
      </div>
    </div>

    <section class="card question-card">
      <div class="next-progress" aria-label="Time until next question">
        <span class="next-progress-fill"></span>
      </div>

      <header class="header">
        <div class="pill category">
          <span class="category-icon">
            <i id="categoryIcon" class="fa-solid fa-circle-question"></i>
          </span>
          <span id="categoryName"></span>
        </div>

        <div class="pill progress" id="progress">—</div>
      </header>

      <h1 id="question"></h1>

      <p class="subtitle" id="subtitle"></p>

      <form id="guessForm">
        <div class="input-wrap">
          <i class="fa-solid fa-ruler ruler"></i>

          <input
            id="guess"
            type="number"
            min="0"
            inputmode="numeric"
            placeholder="Enter a number..."
            autocomplete="off"
            autofocus
          />

          <span class="unit" id="unit">m</span>
        </div>

        <button type="submit" aria-label="Submit answer">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="result-summary" id="resultSummary"></p>
      <p class="off-by" id="offBy"></p>

      <div class="loading-bars" aria-hidden="true">
        <span class="loading-bar loading-bar--red">Your<br />Answer</span>
        <span class="loading-bar loading-bar--blue">Real<br />Answer</span>
      </div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <section class="end-screen" id="endScreen" aria-live="polite" aria-hidden="true">
        <p class="end-kicker">Great round</p>
        <p class="end-score-label">Your final score is</p>
        <p class="end-score" id="finalScore">0</p>

        <div class="end-actions">
          <button class="play-again-button" id="playAgainButton" type="button">
            Play again <i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i>
          </button>
          <a class="home-button" href="../index.html">
            <i class="fa-solid fa-house" aria-hidden="true"></i>Back to home
          </a>
        </div>
      </section>
    </section>

    <aside class="card image-card" aria-label="Question image"></aside>
  </main>

  <script>
    let questions = [];

    const SUPABASE_URL = "https://fjjhpratbgtovbdelxdy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3UZIsIA3OzDdDpioKlJR1g_njcIfY1R";
    const accountName = document.getElementById("accountName");
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let playerProfile = null;

    async function initializePlayer() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session?.user) {
          window.location.replace("../account_create.html");
          return false;
        }

        currentUser = data.session.user;
        const username = currentUser.user_metadata?.username || "Player";
        accountName.textContent = username;

        const { data: profile, error: profileError } = await supabaseClient
          .from("profiles")
          .upsert(
            { id: currentUser.id, username },
            { onConflict: "id" }
          )
          .select()
          .single();

        if (profileError) throw profileError;

        const { data: startedProfile, error: gameStartError } = await supabaseClient
          .from("profiles")
          .update({
            games_played: profile.games_played + 1,
            updated_at: new Date().toISOString()
          })
          .eq("id", currentUser.id)
          .select()
          .single();

        if (gameStartError) throw gameStartError;

        playerProfile = startedProfile;
        return true;
      } catch (error) {
        console.error("Could not initialize the player profile:", error);
        feedback.textContent = "Your player profile could not be loaded. Please try again.";
        input.disabled = true;
        document.querySelector("#guessForm button").disabled = true;
        return false;
      }
    }

    async function loadQuestionsFromSupabase() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/questions?mode=eq.classic&is_active=eq.true&order=sort_order.asc`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) throw new Error(`Supabase returned ${response.status}`);

        const rows = await response.json();
        if (!rows.length) throw new Error("No active classic questions found");

        questions = rows.map((row) => ({
          category: row.category,
          icon: row.icon.startsWith("fa-") ? row.icon : `fa-${row.icon}`,
          question: row.question_highlight
            ? `${row.question_text}<br><span>${row.question_highlight}</span>`
            : row.question_text,
          hint: row.hint,
          id: row.id ? String(row.id) : row.question_text,
          answer: Number(row.answer),
          unit: row.unit || "",
          image: row.image_url || ""
        }));
        return true;
      } catch (error) {
        console.error("Supabase questions unavailable.", error);
        feedback.textContent = "No questions available. Please check the database.";
        input.disabled = true;
        document.querySelector("#guessForm button").disabled = true;
        return false;
      }
    }

    let current = 0;

    const icon = document.getElementById("categoryIcon");
    const category = document.getElementById("categoryName");
    const question = document.getElementById("question");
    const hint = document.getElementById("subtitle");
    const unit = document.getElementById("unit");
    const image = document.querySelector(".image-card");
    const input = document.getElementById("guess");
    const feedback = document.getElementById("feedback");
    const progress = document.getElementById("progress");
    const game = document.querySelector(".game");
    const resultSummary = document.getElementById("resultSummary");
    const offBy = document.getElementById("offBy");
    const yourBar = document.querySelector(".loading-bar--red");
    const realBar = document.querySelector(".loading-bar--blue");
    const streakValue = document.getElementById("streak");
    const scoreValue = document.getElementById("score");
    const averageTimeValue = document.getElementById("averageTime");
    const endScreen = document.getElementById("endScreen");
    const finalScore = document.getElementById("finalScore");
    let streak = 0;
    let score = 0;
    let totalAnswerTime = 0;
    let answeredQuestions = 0;
    let questionStartedAt = performance.now();

    function calculateRoundScore(diff, answer, answerTime, currentStreak) {
      const accuracy = Math.max(0, 1 - diff / answer);
      const accuracyPoints = Math.round(accuracy * 100);
      const speedBonus = Math.round(
        Math.max(0, 25 * (1 - Math.min(answerTime, 25) / 25)) * accuracy
      );
      const streakMultiplier = 1 + Math.min(Math.max(currentStreak - 1, 0), 10) * 0.05;

      return Math.round((accuracyPoints + speedBonus) * streakMultiplier);
    }

    async function saveRound({ item, guess, diff, answerTime, roundScore }) {
      if (!currentUser || !playerProfile) return;

      try {
        const { error: roundError } = await supabaseClient
          .from("game_rounds")
          .insert({
            user_id: currentUser.id,
            game_mode: "classic",
            question_reference: item.id,
            guess_value: guess,
            correct_value: item.answer,
            difference_value: diff,
            score_earned: roundScore,
            answer_time_ms: Math.round(answerTime * 1000)
          });

        if (roundError) throw roundError;

        const profileUpdate = {
          total_score: playerProfile.total_score + roundScore,
          best_streak: Math.max(playerProfile.best_streak, streak),
          questions_answered: playerProfile.questions_answered + 1,
          total_answer_time_ms: playerProfile.total_answer_time_ms + Math.round(answerTime * 1000),
          updated_at: new Date().toISOString()
        };

        const { data: updatedProfile, error: profileError } = await supabaseClient
          .from("profiles")
          .update(profileUpdate)
          .eq("id", currentUser.id)
          .select()
          .single();

        if (profileError) throw profileError;
        playerProfile = updatedProfile;
      } catch (error) {
        console.error("Could not save this game round:", error);
      }
    }

    function showEndScreen() {
      finalScore.textContent = score.toLocaleString();
      endScreen.setAttribute("aria-hidden", "false");
      game.classList.add("is-complete");
    }

    function playAgain() {
      current = 0;
      streak = 0;
      score = 0;
      totalAnswerTime = 0;
      answeredQuestions = 0;
      endScreen.setAttribute("aria-hidden", "true");
      game.classList.remove("is-complete", "is-finishing", "is-advancing");
      renderQuestion();
    }

    function renderQuestion() {
      const item = questions[current];

      icon.className = `fa-solid ${item.icon}`;
      category.textContent = item.category;
      question.innerHTML = item.question;
      hint.textContent = item.hint;
      unit.textContent = item.unit;
      resultSummary.textContent = "";
      offBy.textContent = "";

      image.style.backgroundImage =
        `linear-gradient(180deg, rgba(81,189,226,.16), rgba(18,33,42,.12)), url("${item.image}")`;

      progress.textContent = `${current + 1} / ${questions.length}`;

      input.value = "";
      feedback.textContent = "";
      input.focus();
      questionStartedAt = performance.now();
    }

    document.getElementById("guessForm").addEventListener("submit", (event) => {
      event.preventDefault();

      if (game.classList.contains("is-advancing")) return;

      const item = questions[current];
      const guess = Number(input.value);

      if (!input.value || guess < 0) {
        feedback.textContent = "Enter a valid number first.";
        input.focus();
        return;
      }

      const diff = Math.abs(guess - item.answer);
      const answerTime = (performance.now() - questionStartedAt) / 1000;
      totalAnswerTime += answerTime;
      answeredQuestions += 1;

      const accuracy = Math.max(0, 1 - diff / item.answer);

      if (accuracy >= 0.75) {
        streak += 1;
      } else {
        streak = 0;
      }

      const roundScore = calculateRoundScore(diff, item.answer, answerTime, streak);
      score += roundScore;

      streakValue.textContent = streak;
      scoreValue.textContent = score;
      averageTimeValue.textContent = `${(totalAnswerTime / answeredQuestions).toFixed(1)}s`;

      if (diff === 0) {
        feedback.textContent = "Perfect! Exactly right.";
      } else if (diff / item.answer <= 0.1) {
        feedback.textContent =
          `So close — only ${Math.round(diff).toLocaleString()} ${item.unit} away!`;
      } else {
        feedback.textContent =
          `Answer: ${item.answer.toLocaleString()} ${item.unit}. Next question loading…`;
      }

      const answerLabel = item.unit ? `${item.answer.toLocaleString()}${item.unit}` : item.answer.toLocaleString();
      resultSummary.innerHTML = `The answer is <span>${answerLabel}</span>`;
      const differenceLabel = diff === 0
        ? "You were exactly right"
        : `You were off by ${diff.toLocaleString()}${item.unit ? ` ${item.unit}` : ""}`;
      offBy.textContent = differenceLabel;
      const realHeight = 0.57;
      const yourHeight = Math.min(0.96, (guess / item.answer) * realHeight);
      yourBar.style.setProperty("--your-height", `${yourHeight * 100}%`);
      realBar.style.setProperty("--real-height", `${realHeight * 100}%`);
      yourBar.classList.toggle("is-compact", yourHeight < 0.18);

      game.classList.add("is-advancing");
      saveRound({ item, guess, diff, answerTime, roundScore });

      const isLastQuestion = current === questions.length - 1;
      if (isLastQuestion) game.classList.add("is-finishing");

      window.setTimeout(() => {
        if (isLastQuestion) {
          game.classList.remove("is-advancing", "is-finishing");
          showEndScreen();
          return;
        }

        current += 1;
        renderQuestion();
        game.classList.remove("is-advancing");
      }, 5760);
    });

    document.getElementById("playAgainButton").addEventListener("click", playAgain);

    initializePlayer().then((ready) => {
      if (!ready) return;

      loadQuestionsFromSupabase().then((loaded) => {
        if (loaded) renderQuestion();
      });
    });
  </script>
</body>
</html>
