<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloseCall | Classic Mode</title>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    :root {
      --blue: #2f73f6;
      --blue-dark: #1f62e6;
      --text: #08090b;
      --muted: #8490a7;
      --line: #dfe3ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, system-ui, sans-serif;
      background: url("images/bg_1.png") center / cover fixed no-repeat;
    }

    .game {
      position: relative;
      width: min(1495px, calc(100% - 48px));
      display: grid;
      grid-template-columns: 1.28fr 0.82fr;
      gap: 62px;
      padding: 52px 0;
      transition:
        grid-template-columns 760ms cubic-bezier(0.22, 1, 0.36, 1),
        gap 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .next-progress {
      position: absolute;
      top: 0;
      left: -8px;
      z-index: 4;
      width: calc(100% + 16px);
      height: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: #f0f1f3;
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease;
    }

    .next-progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #d5d6d8;
      transition: none;
    }

    .game.is-advancing .next-progress-fill {
      width: 100%;
      transition: width 5000ms linear 760ms;
    }

    .game.is-advancing .next-progress {
      opacity: 1;
      visibility: visible;
      transition-delay: 760ms;
    }

    .card {
      min-height: 725px;
      border-radius: 72px;
      box-shadow: 0 24px 54px rgba(51, 64, 94, 0.14);
    }

    .question-card {
      position: relative;
      z-index: 2;
      overflow: hidden;
      padding: 70px 96px;
      background: rgba(255, 255, 255, 0.96);
    }

    .question-card > * {
      transition:
        opacity 260ms ease,
        transform 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .loading-bars {
      position: absolute;
      inset: auto auto 0 50%;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      gap: 72px;
      width: 392px;
      height: 430px;
      opacity: 0;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .result-summary {
      position: absolute;
      top: 58px;
      left: 0;
      z-index: 3;
      width: 100%;
      margin: 0;
      color: #111217;
      text-align: center;
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 400;
      letter-spacing: -2.2px;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition:
        opacity 240ms ease,
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .result-summary span {
      color: #ff7075;
      font-weight: 600;
    }

    .off-by {
      position: absolute;
      top: 154px;
      left: 0;
      z-index: 3;
      width: 100%;
      margin: 0;
      color: #8490a7;
      text-align: center;
      font-size: 32px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition:
        opacity 240ms ease,
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .loading-bar {
      display: block;
      width: 160px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 24px;
      box-sizing: border-box;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.25;
      text-align: center;
      border-radius: 28px 28px 0 0;
      transform: scaleY(0);
      transform-origin: bottom;
    }

    .loading-bar.is-compact {
      padding-bottom: 0;
      font-size: 0;
    }

    .loading-bar--blue {
      height: var(--real-height, 57%);
      background: #4e7df7;
    }

    .loading-bar--red {
      height: var(--your-height, 80%);
      background: #ff7075;
    }

    .game.is-advancing .question-card > *:not(.loading-bars):not(.result-summary):not(.off-by):not(.next-progress) {
      opacity: 0;
      transform: translateX(-18px);
      transition-delay: 760ms;
      transition-duration: 140ms, 260ms;
    }

    .game.is-advancing .loading-bars {
      opacity: 1;
      transition: opacity 220ms ease 760ms;
    }

    .game.is-advancing .result-summary {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 760ms;
    }

    .game.is-advancing .off-by {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 760ms;
    }

    .game.is-advancing .loading-bar {
      animation: bar-rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 760ms both;
    }

    .game.is-advancing .loading-bar--red {
      animation-delay: 860ms;
    }

    @keyframes bar-rise {
      from {
        transform: scaleY(0);
      }
      to {
        transform: scaleY(1);
      }
    }

    .image-card {
      z-index: 1;
      transition:
        opacity 560ms ease,
        transform 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .game.is-advancing .question-card {
      border-radius: 72px;
    }

    .game.is-advancing .image-card {
      opacity: 0;
      transform: translateX(12px) scale(1.02);
      transition-delay: 480ms;
    }

    .game.is-advancing {
      grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
      gap: 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 12px 19px;
      border-radius: 999px;
      font-size: 19px;
      font-weight: 600;
    }

    .category {
      color: var(--blue);
      background: #edf4ff;
    }

    .category-icon {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      font-size: 18px;
    }

    .progress {
      color: #111217;
      background: #f1f1f3;
    }

    h1 {
      max-width: 670px;
      margin: 105px 0 35px;
      color: var(--text);
      font-size: clamp(52px, 5.2vw, 79px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -4.8px;
    }

    h1 span {
      color: var(--blue);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 28px;
      letter-spacing: -0.8px;
    }

    form {
      display: flex;
      gap: 32px;
      align-items: center;
      margin-top: 65px;
    }

    .input-wrap {
      position: relative;
      width: min(100%, 548px);
    }

    input {
      width: 100%;
      height: 111px;
      padding: 0 83px 0 88px;
      border: 3px solid var(--line);
      border-radius: 30px;
      outline: 0;
      color: var(--text);
      font: inherit;
      font-size: 28px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #c8cbd1;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 5px #eaf1ff;
    }

    .ruler {
      position: absolute;
      top: 39px;
      left: 31px;
      color: #8b96aa;
      font-size: 28px;
      pointer-events: none;
    }

    .unit {
      position: absolute;
      top: 35px;
      right: 30px;
      color: #909bae;
      font-size: 28px;
      pointer-events: none;
    }

    button {
      width: 111px;
      height: 111px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 30px;
      cursor: pointer;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 13px 25px rgba(47, 115, 246, 0.25);
      font-size: 48px;
      transition:
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        background-color 500ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    button i {
      display: inline-block;
      transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    button:hover {
      background: #397bf3;
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 18px 32px rgba(47, 115, 246, 0.28);
    }

    button:hover i {
      transform: translateX(4px);
    }

    button:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 8px 16px rgba(47, 115, 246, 0.22);
    }

    button:focus-visible {
      outline: 4px solid rgba(47, 115, 246, 0.22);
      outline-offset: 5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .game,
      .next-progress,
      .next-progress-fill,
      button,
      button i,
      .question-card > *,
      .image-card,
      .loading-bars,
      .loading-bar,
      .result-summary,
      .off-by {
        transition: none;
        animation: none;
      }
    }

    .feedback {
      min-height: 31px;
      margin: 27px 0 0;
      color: var(--blue);
      font-size: 20px;
      font-weight: 650;
    }

    .image-card {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(81, 189, 226, 0.16), rgba(18, 33, 42, 0.12)),
        url("https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1100&q=90")
        center / cover;
    }

    .image-card::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(to bottom, transparent 55%, rgba(5, 20, 16, 0.15));
      pointer-events: none;
    }

    @media (max-width: 980px) {
      .game {
        width: min(650px, calc(100% - 28px));
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 26px 0;
      }

      .next-progress {
        left: -6px;
        width: calc(100% + 12px);
        height: 11px;
      }

      .game.is-advancing .question-card {
        transform: none;
      }

      .game.is-advancing {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .game.is-advancing .image-card {
        transform: translateY(16px);
      }

      .card {
        min-height: auto;
        border-radius: 45px;
      }

      .question-card {
        min-height: 565px;
        padding: 42px 34px;
      }

      .loading-bars {
        gap: 24px;
        width: 216px;
        height: 270px;
      }

      .loading-bar {
        width: 96px;
        border-radius: 18px 18px 0 0;
      }

      .result-summary {
        top: 40px;
        font-size: clamp(29px, 7.5vw, 44px);
        letter-spacing: -1.4px;
      }

      .off-by {
        top: 122px;
        font-size: 23px;
      }

      .image-card {
        min-height: 460px;
      }

      h1 {
        margin: 65px 0 23px;
        font-size: clamp(48px, 12vw, 68px);
        letter-spacing: -3.3px;
      }

      .subtitle {
        font-size: 20px;
      }

      form {
        gap: 16px;
        margin-top: 40px;
      }

      input,
      button {
        height: 82px;
        border-radius: 23px;
      }

      input {
        padding-left: 67px;
        font-size: 22px;
      }

      button {
        width: 82px;
        font-size: 39px;
      }

      .ruler {
        top: 25px;
        left: 23px;
        font-size: 22px;
      }

      .unit {
        top: 23px;
        font-size: 22px;
      }

      .pill {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <section class="card question-card">
      <div class="next-progress" aria-label="Time until next question">
        <span class="next-progress-fill"></span>
      </div>

      <header class="header">
        <div class="pill category">
          <span class="category-icon">
            <i id="categoryIcon" class="fa-solid fa-circle-question"></i>
          </span>
          <span id="categoryName"></span>
        </div>

        <div class="pill progress" id="progress">—</div>
      </header>

      <h1 id="question"></h1>

      <p class="subtitle" id="subtitle"></p>

      <form id="guessForm">
        <div class="input-wrap">
          <i class="fa-solid fa-ruler ruler"></i>

          <input
            id="guess"
            type="number"
            min="0"
            inputmode="numeric"
            placeholder="Enter a number..."
            autocomplete="off"
            autofocus
          />

          <span class="unit" id="unit">m</span>
        </div>

        <button type="submit" aria-label="Submit answer">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="result-summary" id="resultSummary"></p>
      <p class="off-by" id="offBy"></p>

      <div class="loading-bars" aria-hidden="true">
        <span class="loading-bar loading-bar--red">Your<br />Answer</span>
        <span class="loading-bar loading-bar--blue">Real<br />Answer</span>
      </div>

      <p class="feedback" id="feedback" aria-live="polite"></p>
    </section>

    <aside class="card image-card" aria-label="Question image"></aside>
  </main>

  <script>
    let questions = [];

    const SUPABASE_URL = "https://fjjhpratbgtovbdelxdy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3UZIsIA3OzDdDpioKlJR1g_njcIfY1R";

    async function loadQuestionsFromSupabase() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/questions?mode=eq.classic&is_active=eq.true&order=sort_order.asc`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) throw new Error(`Supabase returned ${response.status}`);

        const rows = await response.json();
        if (!rows.length) throw new Error("No active classic questions found");

        questions = rows.map((row) => ({
          category: row.category,
          icon: row.icon.startsWith("fa-") ? row.icon : `fa-${row.icon}`,
          question: row.question_highlight
            ? `${row.question_text}<br><span>${row.question_highlight}</span>`
            : row.question_text,
          hint: row.hint,
          answer: Number(row.answer),
          unit: row.unit || "",
          image: row.image_url || ""
        }));
        return true;
      } catch (error) {
        console.error("Supabase questions unavailable.", error);
        feedback.textContent = "No questions available. Please check the database.";
        input.disabled = true;
        document.querySelector("#guessForm button").disabled = true;
        return false;
      }
    }

    let current = 0;

    const icon = document.getElementById("categoryIcon");
    const category = document.getElementById("categoryName");
    const question = document.getElementById("question");
    const hint = document.getElementById("subtitle");
    const unit = document.getElementById("unit");
    const image = document.querySelector(".image-card");
    const input = document.getElementById("guess");
    const feedback = document.getElementById("feedback");
    const progress = document.getElementById("progress");
    const game = document.querySelector(".game");
    const resultSummary = document.getElementById("resultSummary");
    const offBy = document.getElementById("offBy");
    const yourBar = document.querySelector(".loading-bar--red");
    const realBar = document.querySelector(".loading-bar--blue");

    function renderQuestion() {
      const item = questions[current];

      icon.className = `fa-solid ${item.icon}`;
      category.textContent = item.category;
      question.innerHTML = item.question;
      hint.textContent = item.hint;
      unit.textContent = item.unit;
      resultSummary.textContent = "";
      offBy.textContent = "";

      image.style.backgroundImage =
        `linear-gradient(180deg, rgba(81,189,226,.16), rgba(18,33,42,.12)), url("${item.image}")`;

      progress.textContent = `${current + 1} / ${questions.length}`;

      input.value = "";
      feedback.textContent = "";
      input.focus();
    }

    document.getElementById("guessForm").addEventListener("submit", (event) => {
      event.preventDefault();

      if (game.classList.contains("is-advancing")) return;

      const item = questions[current];
      const guess = Number(input.value);

      if (!input.value || guess < 0) {
        feedback.textContent = "Enter a valid number first.";
        input.focus();
        return;
      }

      const diff = Math.abs(guess - item.answer);

      if (diff === 0) {
        feedback.textContent = "Perfect! Exactly right.";
      } else if (diff / item.answer <= 0.1) {
        feedback.textContent =
          `So close — only ${Math.round(diff).toLocaleString()} ${item.unit} away!`;
      } else {
        feedback.textContent =
          `Answer: ${item.answer.toLocaleString()} ${item.unit}. Next question loading…`;
      }

      const answerLabel = item.unit ? `${item.answer.toLocaleString()}${item.unit}` : item.answer.toLocaleString();
      resultSummary.innerHTML = `The answer is <span>${answerLabel}</span>`;
      const differenceLabel = diff === 0
        ? "You were exactly right"
        : `You were off by ${diff.toLocaleString()}${item.unit ? ` ${item.unit}` : ""}`;
      offBy.textContent = differenceLabel;
      const realHeight = 0.57;
      const yourHeight = Math.min(0.96, (guess / item.answer) * realHeight);
      yourBar.style.setProperty("--your-height", `${yourHeight * 100}%`);
      realBar.style.setProperty("--real-height", `${realHeight * 100}%`);
      yourBar.classList.toggle("is-compact", yourHeight < 0.18);

      game.classList.add("is-advancing");

      window.setTimeout(() => {
        current = (current + 1) % questions.length;
        renderQuestion();
        game.classList.remove("is-advancing");
      }, 5760);
    });

    loadQuestionsFromSupabase().then((loaded) => {
      if (loaded) renderQuestion();
    });
  </script>
</body>
</html>
