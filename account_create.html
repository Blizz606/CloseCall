<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloseCall</title>

    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Manrope", sans-serif;

            background:
                linear-gradient(rgba(247, 250, 255, 0.18), rgba(247, 250, 255, 0.18)),
                url("images/Background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px;
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .login-card {
            width: min(100%, 520px);
            min-height: 560px;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.88);
            border-radius: 52px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 42px 54px 36px;

            box-shadow:
                0 26px 64px rgba(70, 95, 135, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(18px);
            animation: card-enter 760ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            display: block;

            width: 148px;
            height: auto;

            object-fit: contain;

            margin-bottom: 30px;
            animation: content-enter 600ms 100ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .account-intro {
            width: 100%;
            margin-bottom: 42px;
            text-align: center;
            animation: content-enter 600ms 170ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .eyebrow {
            margin-bottom: 8px;
            color: #2f7cff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        h1 {
            color: #14161b;
            font-size: clamp(28px, 4vw, 36px);
            line-height: 1.1;
            letter-spacing: -0.055em;
        }

        .intro-copy {
            max-width: 320px;
            margin: 12px auto 0;
            color: #7d8798;
            font-size: 14px;
            line-height: 1.55;
        }

        .account-form {
            width: 100%;
            animation: content-enter 600ms 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .input-label {
            display: block;
            margin: 0 0 9px 4px;
            color: #5e6878;
            font-size: 13px;
            font-weight: 700;
        }

        /* =========================
           USERNAME
        ========================== */

        .input-wrapper {
            position: relative;

            width: 100%;
            height: 68px;

            flex-shrink: 0;
        }

        .input-icon {
            position: absolute;

            left: 22px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 24px;

            color: #2f7cff;

            z-index: 2;

            pointer-events: none;
        }

        .username-input {
            width: 100%;
            height: 100%;

            border: 0;
            outline: 0;

            border: 1px solid transparent;
            border-radius: 18px;

            background: #f1f3f7;

            padding:
                0
                25px
                0
                66px;

            font-family: "Manrope", sans-serif;
            font-size: 18px;
            font-weight: 500;

            letter-spacing: -0.25px;

            color: #262626;

            transition:
                background-color 260ms ease,
                border-color 260ms ease,
                box-shadow 260ms ease;
        }

        .username-input::placeholder {
            color: #969696;
            opacity: 1;

            font-weight: 400;
        }

        .username-input:hover {
            background: #e9edf4;
        }

        .username-input:focus {
            background: #ffffff;
            border-color: #2f7cff;

            box-shadow:
                0 0 0 4px rgba(47, 124, 255, 0.12);
        }

        .input-hint,
        .input-error {
            min-height: 20px;
            margin: 8px 4px 0;
            font-size: 12px;
        }

        .input-hint {
            color: #8d96a6;
        }

        .input-error {
            display: none;
            color: #d7515a;
            font-weight: 600;
        }

        .account-form.has-error .input-error {
            display: block;
        }

        .account-form.has-error .username-input {
            border-color: #e5727a;
            box-shadow: 0 0 0 4px rgba(229, 114, 122, 0.12);
        }

        /* =========================
           BUTTON
        ========================== */

        .continue-button {
            position: relative;
            width: 100%;
            height: 70px;

            margin-top: 20px;

            border: 0;
            outline: 0;

            border-radius: 22px;

            background: #327cff;

            color: #ffffff;

            font-family: "Manrope", sans-serif;
            font-size: 19px;
            font-weight: 700;

            letter-spacing: -0.5px;

            cursor: pointer;

            transition:
                background-color 500ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 500ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .continue-button i {
            margin-left: 9px;
            transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .button-label,
        .button-spinner {
            transition: opacity 220ms ease, transform 220ms ease;
        }

        .button-spinner {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 2px solid rgba(255, 255, 255, 0.38);
            border-top-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.72);
            pointer-events: none;
        }

        .continue-button.is-loading {
            cursor: wait;
            transform: none;
        }

        .continue-button.is-loading:hover {
            background: #327cff;
            transform: none;
            box-shadow: none;
        }

        .continue-button.is-loading .button-label {
            opacity: 0;
            transform: translateY(-4px);
        }

        .continue-button.is-loading .button-spinner {
            opacity: 1;
            transform: scale(1);
            animation: button-spin 700ms linear infinite;
        }

        @keyframes button-spin {
            to {
                rotate: 360deg;
            }
        }

        .continue-button:hover {
            background: #266fe9;

            transform: translateY(-3px) scale(1.01);

            box-shadow:
                0 16px 30px rgba(50, 124, 255, 0.24);
        }

            .continue-button:hover i {
            transform: translateX(4px);
        }

        .continue-button:active {
            transform: translateY(0) scale(0.985);
            box-shadow: 0 7px 15px rgba(50, 124, 255, 0.2);
        }

        .continue-button:focus-visible {
            outline: 4px solid rgba(47, 124, 255, 0.2);
            outline-offset: 4px;
        }

        .privacy-note {
            margin-top: 18px;
            color: #969eac;
            text-align: center;
            font-size: 11px;
            line-height: 1.5;
            animation: content-enter 600ms 310ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes content-enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 650px) {

            body {
                padding: 20px;
            }

            .login-card {
                width: min(100%, 440px);
                min-height: 0;
                height: auto;

                border-radius: 38px;

                padding: 34px 28px 28px;
            }

            .logo {
                width: 132px;
                margin-bottom: 24px;
            }

            .account-intro {
                margin-bottom: 34px;
            }

            .input-wrapper {
                width: 100%;
            }

            .continue-button {
                width: 100%;
                height: 64px;

                font-size: 18px;
            }
        }

        @media (max-width: 420px) {

            .login-card {
                border-radius: 30px;
                padding: 28px 20px 24px;
            }

            .logo {
                width: 116px;
                margin-bottom: 20px;
            }

            .account-intro {
                margin-bottom: 28px;
            }

            .input-wrapper {
                height: 64px;
            }

            .username-input {
                padding-left: 67px;

                font-size: 18px;
            }

            .input-icon {
                left: 21px;

                font-size: 26px;
            }

            .continue-button {
                width: 100%;
                height: 60px;

                font-size: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card,
            .logo,
            .account-intro,
            .account-form,
            .privacy-note,
            .username-input,
            .continue-button,
            .continue-button i {
                animation: none;
                transition: none;
            }

            .continue-button.is-loading .button-spinner {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <img
            src="images/logo.png"
            alt="CloseCall"
            class="logo"
        >

        <header class="account-intro">
            <p class="eyebrow">WELCOME TO CLOSECALL</p>
            <h1>Create your profile</h1>
            <p class="intro-copy">Choose the username other players will see in your game.</p>
        </header>

        <form id="accountForm" class="account-form" novalidate>
            <label class="input-label" for="username">Username</label>

            <div class="input-wrapper">

            <i
                class="fa-regular fa-circle-user input-icon"
            ></i>

            <input
                id="username"
                class="username-input"
                type="text"
                placeholder="Username"
                autocomplete="off"
                aria-describedby="usernameHint usernameError"
                aria-invalid="false"
                maxlength="20"
                spellcheck="false"
            >

            </div>

            <p id="usernameHint" class="input-hint">Use 3–20 characters.</p>
            <p id="usernameError" class="input-error" role="alert">Please enter at least 3 characters.</p>

            <button
                id="continueButton"
                class="continue-button"
                type="submit"
            >
                <span class="button-label">Continue <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
                <span class="button-spinner" aria-hidden="true"></span>
            </button>
        </form>

        <p class="privacy-note">Your account is complety anonymous</p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://fjjhpratbgtovbdelxdy.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3UZIsIA3OzDdDpioKlJR1g_njcIfY1R";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const usernameInput =
            document.getElementById("username");

        const accountForm =
            document.getElementById("accountForm");

        const continueButton =
            document.getElementById("continueButton");

        function setLoading(isLoading) {
            continueButton.classList.toggle("is-loading", isLoading);
            continueButton.disabled = isLoading;
            continueButton.setAttribute("aria-busy", String(isLoading));
        }

        function showError(message) {
            document.getElementById("usernameError").textContent = message;
            accountForm.classList.add("has-error");
            usernameInput.setAttribute("aria-invalid", "true");
        }

        async function continueWithUsername() {

            const username =
                usernameInput.value.trim();

            if (username.length < 3) {
                showError("Please enter at least 3 characters.");
                usernameInput.focus();
                return;
            }

            accountForm.classList.remove("has-error");
            usernameInput.setAttribute("aria-invalid", "false");
            setLoading(true);

            try {
                const { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError) {
                    throw sessionError;
                }

                let user = sessionData.session?.user;

                if (!user) {
                    const { data, error } = await supabaseClient.auth.signInAnonymously({
                        options: {
                            data: { username }
                        }
                    });

                    if (error) {
                        throw error;
                    }

                    user = data.user;
                } else {
                    const { error } = await supabaseClient.auth.updateUser({
                        data: { username }
                    });

                    if (error) {
                        throw error;
                    }
                }

                if (!user) {
                    throw new Error("No user was returned by Supabase.");
                }

                console.log("Signed in anonymously as:", user.id);
                window.location.href = "index.html";
            } catch (error) {
                console.error("Anonymous sign-in failed:", error);
                showError("We couldn't create your player profile. Please try again.");
                setLoading(false);
            }
        }

        accountForm.addEventListener(
            "submit",
            (event) => {
                event.preventDefault();
                continueWithUsername();
            }
        );

        usernameInput.addEventListener(
            "input",
            () => {
                accountForm.classList.remove("has-error");
                usernameInput.setAttribute("aria-invalid", "false");
            }
        );
    </script>

</body>
</html>
